# sale_detail model - 思迅家族销售明细(逐笔流水)
#
# 源表(2026-10-22 真库实测,两个 family 同名):
#   ysx(hbposv10)      t_rm_saleflow 3,327,514 行
#   hbposv7(hbposepro) t_rm_saleflow 1,743,882 行
#
# 关键差异处理:
#   - 列名一律用 **canonical 名**(qty / sale_price / sale_amount …),
#     由 mapping 重写成源列名(sale_qnty / sale_price / sale_money …)。
#     ⚠️ 写源列名会在"两个 family 源列名恰好相同"时蒙混过关,
#     不一致时才炸 —— 而症状是查询那一刻的 column not found。
#   - **退货不是独立行**:实测两个库的 sale_qnty / sale_money / sale_price
#     负值行都是 0 行 ⇒ 逐笔流水里**没有"退货行"**。
#     ysx 用**同一行里的 ret_qnty**(1939 行非 0,恒等于同行 sale_qnty)表示
#     "这一单里被退掉的数量";hbposv7 没有这一列。
#     ⇒ "单据类型 S/R"在共享 schema 里**给不出来**(没有可判的列),
#     也不要靠"负数 = 退货"糊弄(那样恒等于"全是销售")。
#     ⇒ **净额由 family 私有的 live 片段算**(net_qty / net_amount_yuan,
#       见 internal/source/sale_detail_sql.go)。
name: sale_detail
sql_table: sale_detail
# 2026-10-23:改成 live(全仓去 DuckDB)。
# 逐笔流水实测 3327514 / 1743882 行且每天在长 —— 这种表**最不该**有本地副本:
# 副本要么过期(销售流水过期 = POS 少收的钱),要么要不停重拉(压生产库)。
storage: live

dimensions:
  - name: id
    sql: id
    type: number
    title: 流水 ID

  - name: flow_no
    sql: flow_no
    type: string
    title: 流水号

  # ⚠️ order_no / sale_way 是**销售流水查询的必备维度**(销售报表与 POS 回放都要):
  # 少了任何一个,查询会 400 "dimension not found: order_no (on model sale_detail)"
  # ⇒ 症状是"销售流水查不出来",而真因只是 schema 少了一列。
  - name: order_no
    sql: order_no
    type: string
    title: 单据号
    description: |
      源列 flow_no(收银单号)。与 flow_no(流水号)是两回事:
      flow_no 是**逐笔流水**的号,order_no 是**整单**的号。

  - name: random_order_no
    sql: random_order_no
    type: string
    title: 随机单号
    description: |
      源列 flowno_rand。与 order_no 一一对应,但每次交易重新生成
      (收银小票上打的是它,用它对账比 order_no 更准)。

  - name: sale_way
    sql: sale_way
    type: string
    title: 销售方式
    description: |
      源列 sell_way(char(1)):A=购销 / B=代销 / C=联营 …
      销售报表按它分组。

  - name: branch_id
    sql: branch_id
    type: string
    title: 分店 ID

  - name: product_id
    sql: product_id
    type: string
    title: 商品 ID

  - name: sold_at
    sql: sold_at
    type: time
    title: 销售时间

  # ---- 金额 / 数量(源列名见 mapping)----
  #
  # ⚠️ 这几个维度是**销售流水查询的必备项**(销售报表、POS 回放都要):
  # 少了任何一个,查询会 400 "dimension not found: … (on model sale_detail)"
  # ⇒ 症状是"销售流水查不出来",真因只是 schema 少了一列。
  - name: qty
    sql: qty
    type: number
    title: 数量
    description: |
      源列 sale_qnty。

      ⚠️ **实测(2026-10-23,两个生产源库):这一列从不为负**
      (sale_qnty / sale_money / sale_price 的负值行都是 0 行)
      ⇒ **不能用"负数 = 退货"来判退货**(那样写出来的口径恒等于"全是销售")。

      逐笔流水的退货**不是独立行**,而是**同一行里的另一列**
      (ysx 的 ret_qnty:实测 1939 行非 0,且恒等于同行的 sale_qnty
      ⇒ 卖 2.545 件、其中 2.545 件被退)。
      ⚠️ 而 ret_qnty 是 **ysx 独有**的列(hbposv7 没有)⇒ 它不能进共享 schema
      ⇒ **净额由 family 私有的片段算**(见 net_qty 维度与 net_amount_yuan 度量)。

  # net_qty 是**净额数量**(卖出 − 退回)。
  #
  # ⚠️ 它不在任何 mapping 里 ⇒ 编译器不会重写它 ⇒ 由 family 私有的
  #    live 片段直接产出(见 internal/source/sale_detail_sql.go)。
  - name: net_qty
    sql: net_qty
    type: number
    title: 净额数量
    description: |
      卖出数量 − 退回数量。

      - ysx:源列 sale_qnty − ISNULL(ret_qnty, 0)(ret_qnty 是 ysx 独有列)
      - hbposv7:源列 sale_qnty(该库逐笔流水里**没有退货行** ⇒ 不扣)

      ⇒ 两个 family 的**语义一致**(都是"这张单实际留下多少件")。

  - name: sale_price
    sql: sale_price
    type: number
    title: 售价(元)

  - name: source_price
    sql: source_price
    type: number
    title: 原价(元)
    description: |
      源列 source_price。⚠️ 思迅的 sale_price / source_price 在促销时**互为原价/促销价**
      (别当成固定的两个价),报表口径以商品档案的 price 为准。

  - name: sale_amount
    sql: sale_amount
    type: number
    title: 金额(元)
    description: |
      源列 sale_money(本笔实收/退货金额)。

  - name: discount_amount
    sql: discount_amount
    type: number
    title: 优惠(元)
    description: |
      源列 pref_amt。

  - name: cost_price
    sql: cost_price
    type: number
    title: 成本价(元)
    description: |
      源列 in_price。销售报表的毛利按它算。

  # ---- 收银现场维度 ----
  - name: cashier_id
    sql: cashier_id
    type: string
    title: 收银员编码
    description: |
      源列 oper_id。

  - name: salesman_id
    sql: salesman_id
    type: string
    title: 导购编码
    description: |
      源列 sale_man。

  - name: counter_no
    sql: counter_no
    type: string
    title: 柜台号

  - name: online_flag
    sql: online_flag
    type: string
    title: 是否线上单
    description: |
      源列 remote_flag。

  - name: shift_no
    sql: shift_no
    type: string
    title: 班次号

  - name: pos_id
    sql: pos_id
    type: string
    title: POS 机号
    description: |
      源列 posid。

  - name: spec_sheet_no
    sql: spec_sheet_no
    type: string
    title: 规格单号

  - name: uptime
    sql: uptime
    type: string
    title: 上传时间
    description: |
      源列 uptime(收银端上传时刻)。

measures:
  - name: count
    sql: "COUNT(*)"
    type: number
    title: 流水数

  - name: total_qty
    sql: "SUM(qty)"
    type: number
    title: 总数量(原销售口径)
    format: "0.00"
    description: |
      ⚠️ 这是**原销售**数量(sale_qnty),**没有扣掉退货** ——
      退货在同一行的 ret_qnty 里(ysx 独有列)。
      ⇒ 要"实际留下多少件"用 **net_qty**。

  - name: total_amount_yuan
    sql: "SUM(sale_price * qty)"
    type: number
    title: 总金额(元,原销售口径)
    format: "0.00"
    description: |
      ⚠️ 同上:这是**原销售**金额,**没有扣掉退货**。
      ⇒ 要净额用 **net_amount_yuan**。

  # net_amount_yuan = 净额(原销售 − 退货)。
  #
  # ⚠️ 它对**行内金额**求和,而"行内净额"由 family 私有的 live 片段算
  #    (见 internal/source/sale_detail_sql.go):
  #    - ysx     : (sale_qnty − ISNULL(ret_qnty,0)) × sale_price
  #    - hbposv7 : sale_qnty × sale_price(该库逐笔流水里没有退货行)
  #
  # ⚠️ 为什么不能直接写算式:`ret_qnty` 是 **ysx 独有**的列,
  #    写进共享 schema ⇒ hbposv7 那边直接 column not found
  #    (空表也会报错 —— SQL 解析阶段就失败,与行数无关)。
  #
  # ⚠️ 旧写法 `SUM(CASE WHEN qty < 0 THEN … END)` 是**假的**:
  #    实测 qty 从不为负 ⇒ 它恒等于 total_amount_yuan ⇒ "净额"骗人。
  - name: net_amount_yuan
    sql: "SUM(net_amount)"
    type: number
    title: 净额(销售-退货)
    format: "0.00"

joins:
  - name: product
    sql: product
    on: "{CUBE}.product_id = product.id"
    relationship: many_to_one