# purchase_sheet model - 思迅家族共享 schema(采购单头)
#
# 源表:t_pm_sheet_master(两个 family 同名同表)
#
# ⚠️ 采购单不在 t_im_sheet_master —— 那是库存类单据
#   (实测 trans_no 只有 KB 扣补单 / OO 库存调整 / JO 报损 / KO 领用)。
#   采购模块(pm)的单据才在这张表,按 trans_no 区分:
#     PI 采购收货单  ← 业务上的"采购进货单",hbposv7 10571 张 / ysx 24377 张
#     RO 采购退货单  ← hbposv7 2074 张 / ysx 3562 张
#     PO 采购订单 / WP 线上采购订单 / RT 采购退货通知单 / XJ 询价单 / YX 永续订单
#   前缀释义来自思迅字典表 t_sys_sheet_no,不是猜的。
#
# 实测已审核(approve_flag='1'):hbposv7 PI 10592 / RO 2081;ysx PI 24406 / RO 3564
# 结算单通过 settlement_line.voucher_id 关联本表。
#
# ⚠️ pm 模块**没有独立的退货单表**(实测两库 t_pm% 只有 t_pm_sheet_master /
#   t_pm_sheet_detail / t_pm_process_yh),采购退货单就是本表的 RO 行。
#   要退货单请用 segment `purchase_return`,不要为它单开一个 model ——
#   那会让同一张表的维度定义维护两份,必然分叉(与 settlement/purchase_sheet
#   各自独立单据表的情形不同)。
#
# ⚠️ 金额符号在**两侧相反**,这是审批对账最容易踩的坑(实测 2026-10-10):
#     采购侧 t_pm_sheet_master 的 RO 是**正数**:ysx 3565 张合计 +175.2 万、
#                                  hbposv7 2081 张合计 +130.5 万
#     结算侧 t_fm_recpay_detail 的 RO 是**负数**:ysx 3474 行合计 -171.7 万、
#                                 hbposv7 2668 行合计 -174.4 万
#   直接把采购侧退货额与结算侧退货额相比会**差一个符号、约 346 万**。
#   本 model 的 total_net_amount_yuan 已把 RO 取负,可与
#   settlement_line.total_goods_yuan 直接对账。
#
# 金额不做 dimension(理由同 settlement):带 dimensions: [purchase_sheet.id] 取单据金额。
name: purchase_sheet
sql_table: purchase_sheet
storage: live  # 不落 DuckDB:刚收货的单要立刻可查,落盘快照会漏(见 settlement/schema.yaml 顶部说明)

dimensions:
  - name: id
    sql: id
    type: string
    title: 单据号
    description: 源列 sheet_no。hbposv7 char(20) 补空格,ysx char(14) 不补,查询层统一 RTRIM

  - name: supplier_id
    sql: supplier_id
    type: string
    title: 供应商 ID
    description: 源列 supcust_no。实测 PI 行全部非空(hbposv7 73 个供应商 / ysx 140 个)

  - name: document_type
    sql: document_type
    type: string
    title: 单据类型
    description: 源列 trans_no。进货单只取 PI,退货单只取 RO
    enum_values:
      - { value: "PI", label: 采购收货单 }
      - { value: "RO", label: 采购退货单 }
      - { value: "RT", label: 采购退货通知单 }
      - { value: "PO", label: 采购订单 }
      - { value: "WP", label: 线上采购订单 }
      - { value: "XJ", label: 询价单 }
      - { value: "YX", label: 永续订单 }

  - name: approve_status
    sql: approve_status
    type: string
    title: 审核状态
    enum_values:
      - { value: "0", label: 未审核 }
      - { value: "1", label: 已审核 }

  - name: order_status
    sql: order_status
    type: string
    title: 订单状态
    description: 源列 order_status

  - name: branch_id
    sql: branch_id
    type: string
    title: 分店 ID
    description: 源列 branch_no

  - name: pay_way
    sql: pay_way
    type: string
    title: 付款方式

  - name: currency
    sql: currency
    type: string
    title: 币种
    description: 源列 coin_no,实测恒为 RMB

  - name: created_at
    sql: created_at
    type: time
    title: 制单时间
    description: 源列 oper_date。实测跨度 hbposv7 2024-12~2026-10 / ysx 2021-09~2026-10

  - name: finished_at
    sql: finished_at
    type: time
    title: 审核完成时间
    description: 源列 work_date

  - name: valid_at
    sql: valid_at
    type: time
    title: 生效日期
    description: 源列 valid_date

  - name: operator_id
    sql: operator_id
    type: string
    title: 制单人

  - name: confirmer
    sql: confirmer
    type: string
    title: 审核人
    description: 源列 confirm_man

  - name: remark
    sql: remark
    type: string
    title: 备注
    description: 源列 other1。实测装的是异常说明文本(如"破损、被偷"、"食品破包")

measures:
  - name: count
    sql: "COUNT(*)"
    type: number
    title: 单据数

  - name: total_amount_yuan
    sql: "SUM(amount)"
    type: number
    title: 单据金额合计(元)
    format: "0.00"
    description: 源列 sheet_amt。实测(2026-10-10)hbposv7 PI 合计 1133.9 万 / ysx 2989.5 万。
      ⚠️ **退货单(RO)在本表里是正数**(实测 ysx RO 3565 张合计 +175.2 万,
      hbposv7 2081 张合计 +130.5 万,明细行 sub_amt 负数计数均为 0),
      所以这个 measure 不加 segment 直接聚合 = 进货 + 退货,**实测多算 261 万
      (hbposv7,1117.2→1378.2)/ 350 万(ysx,2867.6→3218.0)**。算净额请用 total_net_amount_yuan

  - name: total_net_amount_yuan
    sql: "SUM(CASE WHEN document_type = 'RO' THEN -amount ELSE amount END)"
    type: number
    title: 单据净额合计(元)
    format: "0.00"
    description: 退货单取负,与 settlement_line.total_goods_yuan 同口径。
      不带 segment = 进货减退货的净额;带 purchase_return segment = 负的退货额
      (实测 ysx -175.2 万 / hbposv7 -130.5 万);带 purchase_receipt segment =
      正的进货额。**审批对账请用这个 measure**,而不是 total_amount_yuan。
      SQL 里用 canonical 名 document_type / amount,由 mapping 在查询时重写成
      该 family 的源列名(实测两库源列都是 trans_no / sheet_amt)

  - name: total_order_amount_yuan
    sql: "SUM(order_amount)"
    type: number
    title: 订货金额合计(元)
    format: "0.00"
    description: 源列 order_amt

segments:
  - name: purchase_receipt
    sql: "document_type = 'PI'"
    title: 仅采购收货单
    description: 业务上的"采购进货单"。算进货金额必须带上它 —— 同表里还装着 RO 退货、
      PO 采购订单、WP 线上采购订单(实测 hbposv7 PI 10593 / RO 2081 / PO 224 / WP 242;
      ysx PI 24407 / RO 3565 / PO 211)

  - name: purchase_return
    sql: "document_type = 'RO'"
    title: 仅采购退货单
    description: 退货单。结算明细里同样有 RO(实测 hbposv7 2668 行 / ysx 3474 行),
      审批"逐单核对采购与结算"时用它定位源单据。
      ⚠️ 本表 RO 金额是**正数**,而结算侧 RO 是负数 —— 两边直接相加/对比会差一个符号。
      对账请用 total_net_amount_yuan(退货已取负)与 settlement_line.total_goods_yuan 对齐

joins:
  - name: supplier
    sql: supplier
    on: "{CUBE}.supplier_id = supplier.id"
    relationship: many_to_one

  - name: purchase_sheet_line
    sql: purchase_sheet_line
    on: "{CUBE}.id = purchase_sheet_line.sheet_id"
    relationship: one_to_many