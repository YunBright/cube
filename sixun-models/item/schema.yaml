# item model - 销售报表的**商品档案**侧(仅供 sales_report JOIN)
#
# 源表:t_bd_item_info(商品主表)
#
# # 为什么它是 storage: live,而不是复用现有的 duck model `product`
#
# ✅ 实测 pkg/cubequery/join.go 的 checkStorage:**joins 两侧都必须是 live**。
# base 是 live(sales_report),target 是 duck(product)会直接被拒:
# "cannot join ... joins are live-only (mixing storage would query two
# different engines in one statement)"。
# 而 registryOf(sixun-*/main.go)只把 live model 放进 join registry,
# 所以引用 `product.*` 会被明确报 "not available (duck model 或未加载)"。
#
# → 这不是重复建模的疏忽,是 live JOIN 这条链路的硬约束。
#   代价是 t_bd_item_info 现在有两个模型:`product`(duck,给枚举/档案查询)
#   与 `item`(live,给销售报表 JOIN)。
#
# # storage: live 而不是物化进 DuckDB
#
# ✅ 实测 hbposepro 44369 行 / ysx 27299 行。这个量级本身不大,
# 但它每天都随商品建档/改价变动,而 DuckDB 侧的 product 已有增量刷新机制。
# 这里保持 live 是为了**不引入第二份需要同步的快照** —— 一旦有人给 live
# 模型加上物化,它就会变成第二套可能与源库不一致的数据源。
name: item
sql_table: item
storage: live

primary_key: id

dimensions:
  - name: id
    sql: id
    type: string
    title: 商品编码
    description: |
      源列 item_no,char(20) 且**不同库补空格规则不一致**
      (hbposv7 补空格、ysx 不补),所以 JOIN 条件里不做 RTRIM ——
      ✅ 实测 SELECT 阶段 RTRIM + JOIN 条件也 RTRIM 与只 SELECT 阶段 RTRIM
      差 17 倍执行时间,按现有约定只在 SELECT 侧处理。

  - name: name
    sql: name
    type: string
    title: 商品名称

  - name: clsno
    sql: clsno
    type: string
    title: 末级类别编码
    description: 源列 item_clsno。⚠️ 这是**末级**,不是报表要的那一层

  - name: brand_name
    sql: brand_name
    type: string
    title: 品牌
    description: |
      源列 item_brandname。✅ 实测覆盖率 100%,但按品牌聚合当天只返回
      1 组("PM"),区分度为零 —— 业务已确认不把品牌作为报表维度。
      这里仍然暴露,是为了下钻时能回答"这批货是哪个牌子"。

  - name: unit
    sql: unit
    type: string
    title: 单位
    description: 源列 unit_no,值即单位名本身("kg"/"袋")

measures:
  - name: count
    sql: "COUNT(*)"
    type: number
    title: 行数

joins:
  # 顺着商品 → 末级类别 → 父类别,两跳。
  # 第二跳声明在 item_cls 上(不是 item 上),因为 cls_parent 只存在于
  # t_bd_item_cls —— ✅ 实测 t_bd_item_info 的 55 个列里没有 cls_parent。
  - name: item_cls
    sql: item_cls
    on: "{CUBE}.clsno = item_cls.id"
    relationship: many_to_one
