# product model - 思迅家族共享 schema
name: product
sql_table: product
# 2026-10-23:改成 live(全仓去 DuckDB)。
#
# ⚠️ 为什么必须 live:pkg/cubequery/join.go 的 checkStorage 拒绝任何
#    非 live 的 join 两侧,而后台的「商品销售流水」查询**同时**要
#    sale_detail.* 与 product.* ⇒ sale_detail → product 必须都是 live。
storage: live
# 增量刷新按主键 upsert(见 internal/dataloader)。
# 没有它就只能全量重建表 —— 实测每天约 10 行变更 vs 44316 行全量。
primary_key: id

dimensions:
  - name: id
    sql: id
    type: string
    title: 商品 ID

  - name: name
    sql: name
    type: string
    title: 商品名称

  - name: category_id
    sql: category_id
    type: string
    title: 分类 ID

  - name: supplier_id
    sql: supplier_id
    type: string
    title: 主供应商 ID

  # 2026-10-09 新增:商品基本单位(提/箱/瓶/kg)。
  # 源库侧两个 family 都是 t_bd_item_info.unit_no (char),
  # 且**值直接就是单位名本身**(不是编号),不需要 join 单位表:
  #   ysx/hbposv7 实测 6922303199721 = '提'
  # 因为是共享 schema,两个 family 的 mapping 都必须同时映射该列,
  # 否则查询 product.unit 时该 family 的 DuckDB 表无此列会直接 SQL 报错。
  - name: unit
    sql: unit
    type: string
    title: 商品单位

  - name: status
    sql: status
    type: string
    title: 状态

  - name: created_at
    sql: created_at
    type: time
    title: 建档时间

  # updated_at = "这一行最后一次被写入的时间"。
  #
  # ⚠️ **为什么必须用 COALESCE,不能直接用 modify_date**
  #   源库 `t_bd_item_info.modify_date` 有 **25%~28% 的行是 NULL**,
  #   而**新建商品 80% 是 NULL**(思迅建档不写 modify_date)。
  #   ⇒ 直接按 modify_date 过滤 ⇒ **新商品永远导不出去**
  #   ⇒ POS 搜不到新上的货,而且**零报错**。
  #   ⇒ 用 COALESCE(modify_date, created_at):新建商品用建档时间兜底。
  #
  #   实测(2026-10-22 真库):ysx 27569 行 / 6816 NULL(25%);
  #   hbposv7 44623 行 / 12607 NULL(28%)。
  #
  # ⚠️ **type 必须是 time**(不是 string):
  #   live 路径会把时间列 CAST 成 DATETIME 比较(保留时分秒);
  #   若声明成 string,比较会退化成文本比较 ⇒ 字典序 ≠ 时间序 ⇒ 过滤静默出错。
  - name: updated_at
    sql: "COALESCE(modify_date, created_at)"
    type: time
    title: 最后变动时间
    description: |
      增量导出的过滤维度(cube-router 的 products / prices scope 用它加 `gt` 过滤)。

      ⚠️ 它**只用于增量过滤**,不是业务字段 ——
      业务上的"商品上架时间"仍然是 created_at。

measures:
  - name: count
    sql: "COUNT(*)"
    type: number
    title: 商品数

  - name: avg_price_yuan
    sql: "AVG(price_yuan)"
    type: number
    title: 平均售价(元)
    format: "0.00"

  - name: max_price_yuan
    sql: "MAX(price_yuan)"
    type: number
    title: 最高售价(元)
    format: "0.00"

  - name: min_price_yuan
    sql: "MIN(price_yuan)"
    type: number
    title: 最低售价(元)
    format: "0.00"

  - name: total_cost_yuan
    sql: "SUM(cost_yuan)"
    type: number
    title: 总进价(元)
    format: "0.00"

joins:
  # 跨 model  JOIN(同 app 内 OK;跨 app 由 gateway 协调)
  - name: supplier
    sql: supplier
    on: "{CUBE}.supplier_id = supplier.id"
    relationship: many_to_one