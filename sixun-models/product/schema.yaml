# product model - 思迅家族共享 schema
name: product
sql_table: product

dimensions:
  - name: id
    sql: id
    type: string
    title: 商品 ID

  - name: name
    sql: name
    type: string
    title: 商品名称

  - name: category_id
    sql: category_id
    type: string
    title: 分类 ID

  - name: supplier_id
    sql: supplier_id
    type: string
    title: 主供应商 ID

  # 2026-10-09 新增:商品基本单位(提/箱/瓶/kg)。
  # 源库侧两个 family 都是 t_bd_item_info.unit_no (char),
  # 且**值直接就是单位名本身**(不是编号),不需要 join 单位表:
  #   ysx/hbposv7 实测 6922303199721 = '提'
  # 因为是共享 schema,两个 family 的 mapping 都必须同时映射该列,
  # 否则查询 product.unit 时该 family 的 DuckDB 表无此列会直接 SQL 报错。
  - name: unit
    sql: unit
    type: string
    title: 商品单位

  - name: status
    sql: status
    type: string
    title: 状态

  - name: created_at
    sql: created_at
    type: time
    title: 建档时间

measures:
  - name: count
    sql: "COUNT(*)"
    type: number
    title: 商品数

  - name: avg_price_yuan
    sql: "AVG(price_yuan)"
    type: number
    title: 平均售价(元)
    format: "0.00"

  - name: max_price_yuan
    sql: "MAX(price_yuan)"
    type: number
    title: 最高售价(元)
    format: "0.00"

  - name: min_price_yuan
    sql: "MIN(price_yuan)"
    type: number
    title: 最低售价(元)
    format: "0.00"

  - name: total_cost_yuan
    sql: "SUM(cost_yuan)"
    type: number
    title: 总进价(元)
    format: "0.00"

joins:
  # 跨 model  JOIN(同 app 内 OK;跨 app 由 gateway 协调)
  - name: supplier
    sql: supplier
    on: "{CUBE}.supplier_id = supplier.id"
    relationship: many_to_one