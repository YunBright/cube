# .goreleaser configuration for cube
#
# 生产部署由 F:\go\src\github.com\YunBright\deployer\deploy-cube.ps1 驱动。
# 该脚本的契约(必须严格满足):
#   - 必须在 $CubeDir/dist/ 下产出 3 个 .tar.gz 归档
#   - 归档文件名 = <project>_<version>_<OS>_<arch>.tar.gz(被脚本当 leaf 传到 ssh tar -xzf)
#   - 解压必须能在 <RemoteDir>/ 及其子目录下完成,extract 步骤是
#     `cd <归档所在父目录> && tar -xzf <leaf>`,所以归档内部结构 = 生产 cwd 的内容
#   - chmod 步骤用正则 `^\s*binary:\s*"?([^"\s#]+)"?` 从本文件提取 binary 名,然后
#     `find <RemoteDir> -type f \( -name '<binary>' ... \)` 递归 chmod +x
#   - 因此 `binary: <name>` 必须保留,且二进制在归档顶层就叫 <name>(不能带目录前缀)
#
# 生产远端目录布局(由 deploy-cube.ps1 拼出来):
#   <RemoteDir>/                                          ← gateway 的 cwd
#     gateway                                             ← 二进制
#     config.yaml                                         ← gateway 配置
#     components/                                         ← dapr 组件
#   <RemoteDir>/semantic-layers/sixun-hbposv7/           ← hbposv7 app 的 cwd
#     sixun-hbposv7                                       ← 二进制
#     config.yaml                                         ← 数据源 DSN + 表名
#   <RemoteDir>/semantic-layers/sixun-ysx/               ← ysx app 的 cwd
#     sixun-ysx                                           ← 二进制
#     config.yaml
#
# ★ schema.yaml 与 mapping.yaml 都不在这里 —— 它们用 go:embed 编译进各自的二进制:
#   - schema:  sixun-models/<model>/schema.yaml(全 family 共享一份)
#   - mapping: semantic-layers/sixun/cmd/<binary>/mapping/mapping-<model>.yaml(每个 binary 一份)
# 以前这两类文件是随归档推上去的,靠 systemd 单元里 export CUBE_MODELS_DIR 定位。
# 读盘路径的代价是"路径对不上 → 一个模型都没加载,但启动不报错",已彻底去掉:
# 现在推了二进制就一定带了模型,"二进制版本" 和 "模型版本" 是同一个事实。
#
# 因此归档里只有两类文件:二进制 + config.yaml。
#
# ⚠️ config.yaml 在归档里,意味着**每次部署都会用「打包机上本机工作区的那份」
#    覆盖远端的 config.yaml**。这不是 bug,是刻意保留的行为(用户 2026-10-09 决定
#    不把它移出归档):配置随二进制一起发,保证"跑起来的二进制"和"它用的配置"
#    出自同一次打包,不会出现"改了配置但部署的是别的分支"。
#
#    两个必须知道的后果:
#    1. **config.yaml 不在版本库**(根 .gitignore 第 26 行忽略),只有
#       config.example.yaml 进版本库。所以"仓库里那份 config.yaml"并不存在 ——
#       部署用的就是**你这台打包机工作区里那份**。换机器打包 = 用那份机器的配置。
#    2. **远端任何对手工 config.yaml 的修改(例如轮换源库口令)会在下次部署被静默还原。**
#       要改就改工作区那份,然后重新部署。
#
# ⚠️ config.local.yaml(本地验证用,连真实源库跑 sqlcheck/sqlq 时指向 ssh 隧道端口
#    之类的)也在 .gitignore 里,且**刻意不进归档** —— 它含本机专属 DSN,
#    推到服务器只会盖住部署刚下去的 config.yaml,造成"部署不生效"且零报错。
#    `deploy-cube.ps1 -Step prune` 会顺手删掉远端遗留的同名文件。
#    优先级与用法见 semantic-layers/sixun/internal/appcfg。
#
# 改动 schema/mapping 后必须重新构建(goreleaser),只重推二进制不会带上新模型。
#
# https://goreleaser.com

project_name: cube

before:
  hooks:
    - go mod tidy

builds:
  - main: ./gateway/cmd/gateway
    id: "gateway"
    binary: "gateway"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: 386

  - main: ./semantic-layers/sixun/cmd/sixun-hbposv7
    id: "sixun-hbposv7"
    binary: "sixun-hbposv7"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: 386

  - main: ./semantic-layers/sixun/cmd/sixun-ysx
    id: "sixun-ysx"
    binary: "sixun-ysx"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: 386

archives:
  # gateway: 顶层组件，与配置同目录发布
  # wrap_in_directory: false  —— 避免 tarball 内多套一层同名目录,确保
  #   deploy-cube.ps1 在 <RemoteDir>/ 下解压后, gateway/config.yaml/components/
  #   直接出现在 <RemoteDir>/ 下,而不是 <RemoteDir>/cube_<ver>_Linux_x86_64/...
  # 这里只放 gateway 二进制 + config.yaml + dapr 组件。
  # sixun-models/*.schema.yaml **不再随包发布** —— 已 go:embed 进 cube app 二进制。
  - id: "gateway"
    format: tar.gz
    builds:
      - gateway
    wrap_in_directory: false
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - src: gateway/config.yaml
        dst: config.yaml
      - src: dapr/components
        dst: components

  # sixun-hbposv7: 语义层归档，文件名按目录层级命名（每个 dapr app 一个子目录，
  # 避免 hbposv7 / ysx 的同名 config.yaml 在解压时互相覆盖）
  # wrap_in_directory: false —— 否则解压后多一层 sixun-hbposv7_<ver>_Linux_x86_64/,
  #   app 启动 cwd = .../sixun-hbposv7/ 时找不到 ./config.yaml。
  # mapping/ 不再随包发布 —— 已 go:embed 进本 binary。
  #   新增 mapping 文件只需丢进 cmd/sixun-hbposv7/mapping/,重新构建即生效。
  - id: "sixun-hbposv7"
    format: tar.gz
    builds:
      - sixun-hbposv7
    wrap_in_directory: false
    name_template: 'semantic-layers/sixun-hbposv7/sixun-hbposv7_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    files:
      - src: semantic-layers/sixun/cmd/sixun-hbposv7/config.yaml
        dst: config.yaml

  # sixun-ysx: 语义层归档，文件名按目录层级命名（每个 dapr app 一个子目录，
  # 避免 hbposv7 / ysx 的同名 config.yaml 在解压时互相覆盖）
  # wrap_in_directory: false —— 同上。
  - id: "sixun-ysx"
    format: tar.gz
    builds:
      - sixun-ysx
    wrap_in_directory: false
    name_template: 'semantic-layers/sixun-ysx/sixun-ysx_{{ .Version }}_{{ title .Os }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    files:
      - src: semantic-layers/sixun/cmd/sixun-ysx/config.yaml
        dst: config.yaml

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

# yaml-language-server: $schema=https://goreleaser.com/static/schema.json