# settlement_dx mapping(hbposv7 / ysx 共用同一份)
#
# 源表 t_fm_recpay_dx_master —— 代销帐款单头(与购销结算单的 gx_master、联营的 ly_master 都不同表)。
#
# ⚠️ 两个 family 共有列(2026-11-01 逐表核对):
#   sup_no / start_date / end_date / sum_amount / dct_amount / confirm_man / oper_id /
#   work_date / oper_date / sheet_no / trans_no / approve_flag / settle_date / other1 / get_amt
#   (hbposv7 的列类型是 u_ 前缀的自定义类型,但列名一致 ⇒ 共享 schema 可用)
#
# ⚠️ 金额:
#   sum_amount(→ settle_amount) = 结算额(应付供应商),与明细 Σ ac_amount 相等
#   get_amt   (→ paid_amount)   = 已付
#   dct_amount 恒 0 ⇒ 不映射;代销没有扣点概念
#
# ⚠️ 头表 num1/num2 **不是**零售额(实测 DX002610190001 头表 num1=0、num2=1)
#   ⇒ 零售额只从明细 num1 汇总。
version: 1
model: settlement_dx

mappings:
  - source: sheet_no
    target: id
    type: string

  - source: sup_no
    target: supplier_id
    type: string

  - source: trans_no
    target: document_type
    type: string

  - source: approve_flag
    target: approve_status
    type: string

  - source: branch_no
    target: branch_id
    type: string

  - source: start_date
    target: period_start
    type: datetime

  - source: end_date
    target: period_end
    type: datetime

  - source: settle_date
    target: settled_at
    type: datetime

  - source: oper_date
    target: created_at
    type: datetime

  - source: work_date
    target: finished_at
    type: datetime

  - source: oper_id
    target: operator_id
    type: string

  - source: confirm_man
    target: confirmer
    type: string

  - source: other1
    target: remark
    type: string

  # ---- 金额(不做 dimension,只做物理列 + measure)----
  - source: sum_amount     # 结算额(应付供应商)
    target: settle_amount
    type: decimal
    unit: yuan

  - source: get_amt        # 已付
    target: paid_amount
    type: decimal
    unit: yuan
