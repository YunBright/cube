# hbposv7 supplier mapping:思迅7pro t_bd_supcust_info → 统一 supplier 字段
# target 与 sixun-models/supplier/schema.yaml 的 dimension name 对齐
version: 1
model: supplier

mappings:
  - source: supcust_no          # 主键 char
    target: id
    type: string
    unit: ""

  - source: sup_name            # 供应商名称 varchar
    target: name
    type: string

  - source: sup_type            # 供应商类型 char(1=供应商,5=自用/直供)
    target: type
    type: string

  # 2026-10-16 新增:供应商/客户标识(AI 分析排除自用的第一道闸)。
  # ✅ 实测 S=供应商 / C=客户(运营部、中铁五局搅拌站…不是供货方)。
  - source: supcust_flag
    target: cust_flag
    type: string

  # 2026-10-16 新增:供货方式(展示用,不做自用判定主依据)。
  # ✅ 实测自用四条各不相同(B/C/E/D),说明该字段是各店自定义语义。
  - source: sale_way
    target: supply_way
    type: string

  - source: sup_man             # 联系人 varchar
    target: contact
    type: string

  - source: sup_tel             # 固定电话 varchar(优先)
    target: phone
    type: string

  - source: sup_email           # 邮箱 varchar
    target: email
    type: string

  - source: sup_addr            # 地址 varchar
    target: address
    type: string

  - source: credit_amt          # 信用额 numeric(思迅 char(numeric))
    target: credit_amount
    type: decimal
    unit: yuan

  - source: status              # 状态 char
    target: status
    type: string

  - source: modify_date         # 修改时间 datetime(用作 registered_at proxy)
    target: modified_at
    type: datetime