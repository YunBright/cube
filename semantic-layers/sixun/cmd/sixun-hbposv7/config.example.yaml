# sixun-hbposv7 实例配置
# 启动: dapr run --app-id sixun-hbposv7 -- go run ./cmd/sixun-hbposv7

server:
  http_addr: ":8082"

source:
  version: hbposv7
  # mssql server 2008
  dsn: ""

  # ====== 思迅7pro 真实表名(从 sqlq 输出确认)======
  # 10 个 model:
  #   supplier            供应商
  #   product             商品
  #   category            商品分类
  #   sale_detail         销售明细(**源表实测 0 行空表,见下方说明**)
  #   stock               商品库存
  #   settlement          结款/结算单头(本门店单据类型 = DP 供应商对帐单)
  #   settlement_line     结算明细行(voucher_no = 源单据号)
  #   purchase_sheet      采购单头(PI 采购收货单 / RO 采购退货单)
  #   purchase_sheet_line 采购单明细行
  #   sale_day            销售日汇总
  table_supplier: t_bd_supcust_info
  table_product:  t_bd_item_info
  table_category: t_bd_item_cls
  table_sale:     t_rm_order_saleflow
  table_stock:    t_im_branch_stock

  table_settlement:          t_fm_recpay_gx_master
  table_settlement_line:     t_fm_recpay_detail
  table_purchase_sheet:      t_pm_sheet_master
  table_purchase_sheet_line: t_pm_sheet_detail
  table_sale_day:            t_rm_daysum

  # 拉取行数上限,**只对 storage: duck 的 model 生效**(supplier/product/category/sale_detail)。
  # ⚠️ fetch 用的是 `SELECT TOP N * FROM t`(无 ORDER BY),截断丢的是随机行,
  #    而且 healthz 全绿 —— 这就是历史上 TOP 10000 让 hbposv7 丢 77% 商品的原因。
  #    **每一项都必须高于实测行数。**
  #
  # 括号内为 2026-10-09 实测 COUNT(*):ysx / hbposv7
  #
  # ⚠️ 兜底值必须 >= source.DefaultRowLimit(50000),**不要为了"看起来省事"调小**。
  # 它是"没在 row_limits 里列出的 model"用的,平时用不上,但一旦将来新增一个
  # duck model 忘了加进 row_limits,写小的兜底值就会立刻静默丢数据;
  # 写 50000 最多是"多拉了点",不会错。
  row_limit: 50000
  row_limits:
    product:  200000   # 27299 / 44313
    supplier: 20000    # 218 / 300
    category: 20000    # 186 / 596
    sale:     500000

  # ⚠️ 上面这些 row_limits **不再**需要为 settlement / settlement_line /
  #    purchase_sheet / purchase_sheet_line / sale_day / stock 配置:
  #    它们是 storage: live,**不落 DuckDB**,查询时实时透传源库,
  #    返回行数由查询里的 limit 控制(上限见 pkg/cubequery 的 DefaultLimit)。
  #    上面的 table_* 是它们**必需的**源表名,漏配则该 model 不可查询。

storage:
  duckdb_path: ./data/sixun-hbposv7.duckdb

# 刷新策略:增量为主 + 夜间全量校准
#
# 实测依据(2026-10-10):
#   t_bd_item_info  44316 行,最近 7 天改动 49 行。
#   改造前是"每 30 分钟全量重拉 44316 行",为每天约 10 行的变化付全表扫描的代价。
refresh:
  # model 名 → **源库侧**的增量时间列名。
  # 未列出的 model 自动走全量(category 无时间列;sale_detail 指向的表实测 0 行)。
  incremental:
    product:  modify_date
    supplier: modify_date

  # ==================== 增量回退列 ====================
  # **本库故意不配 incremental_fallback** —— 配了也没有任何效果。
  #
  # 2026-10-10 真库实测:
  #   modify_date 为 NULL 的 12607 行商品,**build_date 也全部为 NULL**
  #   (查 `modify_date IS NULL AND build_date IS NOT NULL` 返回 0 行)。
  #   所以 `COALESCE(modify_date, build_date)` 与只用 modify_date 结果完全一样:
  #     30 天窗口 209 → 209 行,一行不多。
  #   本库 61% 的商品(27151 行)build_date 就是空的。
  #
  # 不为零收益的配置增加复杂度 —— ysx 那边配了,那边确实多覆盖 34%。
  #
  # ⚠️ 无论配不配,**夜间全量校准都不可省**:那 12607 行(占全部商品 28%)
  #    两个时间列都是 NULL,任何基于时间列的增量都永远拉不到它们。

  # 夜间全量校准,6 字段 cron(秒 分 时 日 月 周)= 每天 03:00:00。
  # ⚠️ 必须写满 6 个字段:2026-10-10 真机实测,写 5 字段("0 3 * * *")
  #    会被 Dapr 直接拒绝(HTTP 500: expected exactly 6 fields, found 5),
  #    而主 job 不受影响、mode 照样是 dapr-job —— 于是"夜间校准没了"
  #    会被 healthz 的整体健康掩盖,增量漏的数据永远没有兜底。
  full_schedule: "0 0 3 * * *"

gateway:
  app_id: cube-gateway
  # 注册地址(dev:sidecar 自动解析 app_id → host:port)
  register_method: /register

dapr:
  secret_store: cube-secrets