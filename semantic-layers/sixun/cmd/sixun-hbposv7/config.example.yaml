# sixun-hbposv7 实例配置
# 启动: dapr run --app-id sixun-hbposv7 -- go run ./cmd/sixun-hbposv7

server:
  http_addr: ":8082"

source:
  version: hbposv7
  # mssql server 2008
  dsn: ""

  # ====== 思迅7pro 真实表名(从 sqlq 输出确认)======
  # 10 个 model:
  #   supplier            供应商
  #   product             商品
  #   category            商品分类
  #   sale_detail         销售明细(**源表实测 0 行空表,见下方说明**)
  #   stock               商品库存
  #   settlement          结款/结算单头(本门店单据类型 = DP 供应商对帐单)
  #   settlement_line     结算明细行(voucher_no = 源单据号)
  #   purchase_sheet      采购单头(PI 采购收货单 / RO 采购退货单)
  #   purchase_sheet_line 采购单明细行
  #   sale_day            销售日汇总
  table_supplier: t_bd_supcust_info
  table_product:  t_bd_item_info
  table_category: t_bd_item_cls
  # ⚠️ 旧的 `table_sale` 键已退役(2026-10-22):它配的 t_rm_order_saleflow
  #   实测**表不存在**(ysx 的 t_mp_saleflow 也是 0 行)⇒ 两个库都取不到数据。
  #   sale_detail 现在是 live model,源表名按 `table_<model>` 约定与 model 名对齐。
  table_sale_detail:   t_rm_saleflow       # 逐笔销售流水(实测 1743882 行)
  table_payflow:       t_rm_payflow        # 收银流水(实测 550213 行)
  table_promotion_plan: t_pub_plan_master  # 促销方案头(实测 0 行 —— 本库空表)
  table_supplier_item: t_bd_supcust_item   # 商品供货信息(实测 45275 行)
  table_branch_price:  t_pc_branch_price   # 商品档案价格(实测 44623 行)
  table_stock:    t_im_branch_stock

  # 会员卡档案(t_rm_vip_info)+ 会员类别字典(t_rm_vip_type)。
  # ✅ 实测 2026-10-21:hbposv7 t_rm_vip_info 2642 行 / t_rm_vip_type 3 行。
  # ⚠️ 本库的 t_rm_vip_info 没有 acc_num / dec_num 两列 ⇒ member model 的
  #    points_accumulated / points_used 恒为 NULL(源库事实,照实映射)。
  table_member:      t_rm_vip_info
  table_member_type: t_rm_vip_type
  # 供应商/客户类别字典(t_bd_cust_type)。supplier.cust_clsno 指向它。
  table_cust_type: t_bd_cust_type
  # 「销售方式」字典(t_bd_base_code)。supplier.supply_way(源列 sale_way)指向它。
  #    ⚠️ 这是**通用**基础代码字典(30+ 行,code_id 跨 type_no 重复)⇒ 取数时只取
  #       type_no='SW' 的子集(过滤写在 main.go 的 liveTables 里)。
  table_sale_way:  t_bd_base_code
  # ---- 会员 live 片段(= 主表 JOIN 三张流水表)----
  # 卡内余额 = Σ充值 − Σ储值支付;累计消费在 t_rm_vip_consume。
  # ⚠️ 少配任何一张 ⇒ 片段构造直接报错 ⇒ 启动失败(显式失败,好过"余额恒为 0")。
  table_member_consume:    t_rm_vip_consume
  table_member_paylist:    t_rm_card_paylist
  table_member_savingplus: t_rm_saving_plus_record
  # paylist.card_type 里表示"储值支付"的那个取值(实测两个库都是 '2')。
  member_stored_pay_type: "2"
  # 积分列名(用来在源库侧派生"剩余积分");hbposv7 没有这两列 ⇒ 留空。
  member_points_accumulated_col: acc_num
  member_points_used_col: dec_num

  table_settlement:          t_fm_recpay_gx_master
  table_settlement_line:     t_fm_recpay_detail
  table_purchase_sheet:      t_pm_sheet_master
  table_purchase_sheet_line: t_pm_sheet_detail
  table_sale_day:            t_rm_daysum

  # promotion(POP 价签"当前生效特价",2026-10-15)
  # ⚠️ 本库 t_pub_plan_flow 实测 **0 行**(2026-10-15 逐表 COUNT)。
  #   同库 t_pub_plan_master / t_cbo_plan_info / t_wx_promotion 也都是 0 行 ——
  #   思迅 7pro 这套促销模块在本门店**从未启用**,不是"暂时没录单"。
  #   → 配了不会报错,但 pricing 服务查 promotion 会稳定返回"无生效促销"。
  #   同一张表在 ysx(hbposv10)有 31355 行 / 731 行当前生效,数据是齐的。
  table_promotion: t_pub_plan_flow

  # 拉取行数上限,**只对 storage: duck 的 model 生效**(supplier/product/category/sale_detail)。
  # ⚠️ fetch 用的是 `SELECT TOP N * FROM t`(无 ORDER BY),截断丢的是随机行,
  #    而且 healthz 全绿 —— 这就是历史上 TOP 10000 让 hbposv7 丢 77% 商品的原因。
  #    **每一项都必须高于实测行数。**
  #
  # 括号内为 2026-10-09 实测 COUNT(*):ysx / hbposv7
  #
  # ⚠️ 兜底值必须 >= source.DefaultRowLimit(50000),**不要为了"看起来省事"调小**。
  # 它是"没在 row_limits 里列出的 model"用的,平时用不上,但一旦将来新增一个
  # duck model 忘了加进 row_limits,写小的兜底值就会立刻静默丢数据;
  # 写 50000 最多是"多拉了点",不会错。
  row_limit: 50000
  row_limits:
    product:  200000   # 27299 / 44313
    supplier: 20000    # 218 / 300
    category: 20000    # 186 / 596
    sale:     500000
    # 会员卡档案(t_rm_vip_info):实测 ysx 4128 / hbposv7 2642 行。
    # 它会持续增长 ⇒ 上限给到 20000(截断是静默的,丢的是随机行)。
    member: 20000
    # 会员类别字典(t_rm_vip_type):实测两个库各 3 行,字典表不该被截断。
    member_type: 2000

  # ⚠️ 上面这些 row_limits **不再**需要为 settlement / settlement_line /
  #    purchase_sheet / purchase_sheet_line / sale_day / stock 配置:
  #    它们是 storage: live,**不落 DuckDB**,查询时实时透传源库,
  #    返回行数由查询里的 limit 控制(上限见 pkg/cubequery 的 DefaultLimit)。
  #    上面的 table_* 是它们**必需的**源表名,漏配则该 model 不可查询。

# ⚠️ 2026-10-23 起**没有 storage.duckdb_path 了** —— 不再有本地副本。
  secret_store: cube-secrets