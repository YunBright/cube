# sixun-ysx 实例配置
server:
  http_addr: ":8083"

source:
  version: ysx
  # mssql server 2008 r2
  dsn: ""

  # 思迅云商x 真实表名(同思迅7pro 命名)
  # 结算审批场景新增 5 个 model(2026-10-09):
  #   settlement          结款/结算单头(本门店单据类型 = CP 购销返利计算,DP 为 0 张)
  #   settlement_line     结算明细行(voucher_no = 源单据号)
  #   purchase_sheet      采购单头(PI 采购收货单 / RO 采购退货单)
  #   purchase_sheet_line 采购单明细行
  #   sale_day            销售日汇总(注意:table_sale 指向的 t_mp_saleflow 实测 0 行)
  table_supplier: t_bd_supcust_info
  table_product:  t_bd_item_info
  table_category: t_bd_item_cls
  table_sale:     t_mp_saleflow    # ⚠️ 实测 0 行空表,历史配置,勿依赖
  table_stock:    t_im_branch_stock

  table_settlement:          t_fm_recpay_gx_master
  table_settlement_line:     t_fm_recpay_detail
  table_purchase_sheet:      t_pm_sheet_master
  table_purchase_sheet_line: t_pm_sheet_detail
  table_sale_day:            t_rm_daysum

  # 拉取行数上限,**只对 storage: duck 的 model 生效**(supplier/product/category/sale_detail)。
  # ⚠️ fetch 用的是 `SELECT TOP N * FROM t`(无 ORDER BY),截断丢的是随机行,
  #    而且 healthz 全绿 —— 这就是历史上 TOP 10000 让 ysx 丢 63% 商品、
  #    hbposv7 丢 77% 的原因。**每一项都必须高于实测行数。**
  #
  # 括号内为 2026-10-09 实测 COUNT(*):ysx / hbposv7
  #
  # ⚠️ 兜底值必须 >= source.DefaultRowLimit(50000),**不要为了"看起来省事"调小**。
  # 它是"没在 row_limits 里列出的 model"用的,平时用不上,但一旦将来新增一个
  # duck model 忘了加进 row_limits,写小的兜底值就会立刻静默丢数据;
  # 写 50000 最多是"多拉了点",不会错。
  row_limit: 50000
  row_limits:
    product:  200000   # 27299 / 44313
    supplier: 20000    # 218 / 300
    category: 20000    # 186 / 596
    sale:     500000

  # ⚠️ 上面这些 row_limits **不再**需要为 settlement / settlement_line /
  #    purchase_sheet / purchase_sheet_line / sale_day / stock 配置:
  #    它们是 storage: live,**不落 DuckDB**,查询时实时透传源库,
  #    返回行数由查询里的 limit 控制(上限见 pkg/cubequery 的 DefaultLimit)。
  #    上面的 table_* 是它们**必需的**源表名,漏配则该 model 不可查询。

storage:
  duckdb_path: ./data/sixun-ysx.duckdb

# 刷新策略:增量为主 + 夜间全量校准
#
# 实测依据(2026-10-10):
#   t_bd_item_info  27304 行,但最近 1 天改动 **0 行**、7 天 70 行、30 天 410 行。
#   改造前是"每 30 分钟全量重拉 27304 行",为约 10 行的日变化付全表扫描的代价。
#
# 这里的"增量"只影响 storage: duck 的 model;live 的 model 查询时透传,不参与。
refresh:
  # model 名 → **源库侧**的增量时间列名(不是 canonical 名,因为 WHERE 打在源库上)。
  #
  # 未列出的 model 自动走全量,这是**正常**的:
  #   - category(t_bd_item_cls)实测没有任何时间列,只能全量 —— 才 596 行,无所谓
  #   - sale_detail 指向的表实测 0 行,全量成本为零
  #
  # 前提:schema.yaml 里对应 model 声明了 primary_key(否则无法安全 upsert,
  # 会自动回落到全量并在日志/healthz 里说明原因)。
  incremental:
    product:  modify_date
    supplier: modify_date

  # ==================== 增量回退列 ====================
  # 拼成 COALESCE(modify_date, build_date) >= 水位。留空则退化成单列比较。
  #
  # 为什么需要(2026-10-10 真库实测):
  #   modify_date 为 NULL 的语义是"**建档后从未被修改过**",那这条记录最后一次
  #   被写入的时间就是 build_date。
  #   按 `build_date >= DATEADD(day,-7,GETDATE())` 筛出的 45 个近 7 天新建商品里,
  #   **36 个(80%)modify_date 是 NULL** —— 单靠 modify_date 会漏掉它们,
  #   而它们恰恰是最该被拉到的(旧数据早就被上一次全量带进 DuckDB 了)。
  #   实测 modify_date < build_date 的行数为 0,所以 COALESCE 不会时间倒流。
  #   收益:30 天窗口 410 → 549 行(+139),多覆盖 34% 的新增商品。
  #   代价:COALESCE 让两列索引都失效,实测每次查询多 2~3 ms,可忽略。
  #
  # ⚠️ 它**不能替代夜间全量校准**:本库仍有 31 行商品两个时间列同时为 NULL,
  #    且"客户端写入时不更新 build_date"这类情况只有全量能兜住。
  #
  # supplier 故意不配:源表 t_bd_supcust_info 没有 build_date(实测只有
  # modify_date / check_out_date),而它只有 218 行、30 天才变 2~9 行。
  incremental_fallback:
    product: build_date

  # 夜间全量校准的调度式,原样交给 Dapr 解析(6 字段 cron:秒 分 时 日 月 周)。
  #
  # ⚠️ 必须写满 6 个字段:2026-10-10 真机实测,写 5 字段("0 3 * * *")
  #    会被 Dapr 直接拒绝(HTTP 500: expected exactly 6 fields, found 5),
  #    而主 job 不受影响、mode 照样是 dapr-job —— 于是"夜间校准没了"
  #    会被 healthz 的整体健康掩盖,增量漏的数据永远没有兜底。
  #
  # 为什么不用 "@every 24h":那是"从登记那一刻起每 24 小时",进程重启就漂移,
  # 永远对不上"夜间 3 点"这个语义。
  full_schedule: "0 0 3 * * *"

gateway:
  app_id: cube-gateway
  register_method: /register

dapr:
  secret_store: cube-secrets