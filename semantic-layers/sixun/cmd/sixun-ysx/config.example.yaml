# sixun-ysx 实例配置
server:
  http_addr: ":8083"

source:
  version: ysx
  # mssql server 2008 r2
  dsn: ""

  # 思迅云商x 真实表名(同思迅7pro 命名)
  table_supplier: t_bd_supcust_info
  table_product:  t_bd_item_info
  table_category: t_bd_item_cls
  table_sale:     t_mp_saleflow    # ysx 是 t_mp_saleflow(主表),hbposv7 是 t_rm_order_saleflow,可能不同
  table_stock:    t_im_branch_stock

  # 拉取行数上限。上限过小会**静默**丢数据(没有报错,只是部分商品查不到),
  # 历史上 connector 曾硬编码 TOP 10000,而 hbposv10 的 t_bd_item_info 实测 27299 行,
  # 导致 63% 的商品永远扫不出来。商品表必须给足,行数不够时先确认是否需要分页,
  # 不要靠调小上限掩盖。
  row_limit: 10000
  row_limits:
    # 实测 t_bd_item_info 27299 行 / t_im_branch_stock 23576 行 / t_mp_saleflow 视门店规模
    product: 200000
    stock:   200000
    sale:    500000

storage:
  duckdb_path: ./data/sixun-ysx.duckdb

gateway:
  app_id: cube-gateway
  register_method: /register

dapr:
  secret_store: cube-secrets