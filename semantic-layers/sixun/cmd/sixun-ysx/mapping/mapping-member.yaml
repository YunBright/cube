# ysx member mapping:思迅云商x t_rm_vip_info(会员卡档案) → 统一 member
#
# 与 hbposv7 同 schema(共享 sixun-models/member/schema.yaml),
# 差异**只在源列名** —— 两个库的 t_rm_vip_info 列名高度一致(实测 2026-10-21)。
#
# ✅ 实测行数(2026-10-21):ysx/hbposv10 = 4128 行
#    hbposv7/hbposepro = 2642 行(见 hbposv7 那份 mapping 的注释)
#
# ⚠️ 本 mapping 只做「列名规范化 + 取值」,**不做任何语义归一化**
#   (playbook §3.2 禁止 enum_map / transform):
#   - card_status 原样给 '0'/'1'/'2'/'3'/'5'(不映射成 normal/frozen)
#   - use_num 原样给 999998/999999(= 不限次哨兵),**不转 0**
#   - residual_amt 是**带脏值的 varchar**,原样给字符串,不解析也不清洗
#
# 在 mapping 里偷偷清洗等于把"源库长这样"这个事实藏起来,
# 让下游排查时无从查证。
#
# ⚠️ numeric 源的列(金额 / 积分)type 必须是 **decimal**,不能写 string:
#   go-mssqldb 把 numeric 扫成 []byte,fieldmapping.convert 若按 string 处理
#   会把它变成 "[48 46 48 48]" 这样的**字节码**。
#   (schema 里 dimension 的 type 是**对外契约**,与这里的 mapping type 不同层。)
version: 1
model: member

mappings:
  # 源列 card_id(varchar(20))。
  # ⚠️ 实测 ysx 有 2 行**前导空格**(' 801598')、1 行以反引号开头('`800973');
  #    查询层的 RTRIM 只去尾部空格,前导空格要去不掉 ⇒ 下游按卡号匹配前必须自己 TRIM。
  - source: card_id
    target: id
    type: string

  # 源列 cardid_source(varchar(20))。卡面印刷号。
  # ✅ 实测两库全为空,但列存在且语义明确,照样映射 —— 列的空与非空是数据事实。
  - source: cardid_source
    target: card_face_no
    type: string

  # 源列 card_type(char(2))。
  # ⚠️ ysx 实测 '0'=会员卡(2751) / '1'=储值卡(1376) / '2'=VIP储值卡(1);
  #    hbposv7 还有 'wx'=微信会员(70) ⇒ 取值集合按库不同,原样给,不归一化。
  - source: card_type
    target: card_type
    type: string

  # 源列 vip_name(varchar(40))。✅ 实测 ysx 3773/4128 行有值。
  - source: vip_name
    target: name
    type: string

  # 源列 vip_sex(char(2))。实测值是**中文单字**('女'/'男'),不是 '1'/'2'/'M'/'F'
  # ⇒ 原样给,翻译留给下游。
  - source: vip_sex
    target: gender
    type: string

  # 源列 vip_tel(varchar(16)):固话。与 mobile(手机)分列,不要混用。
  - source: vip_tel
    target: phone
    type: string

  # 源列 mobile(varchar(20)):手机号。
  - source: mobile
    target: mobile
    type: string

  # 源列 birthday(datetime)。
  # ⚠️ 实测 ysx 4048/4128 行是 NULL(只有 80 行填了生日)⇒ 不能当必填字段。
  - source: birthday
    target: birthday
    type: datetime

  # 源列 social_id(varchar(18)):身份证号。✅ 实测 ysx 只有 12 行非空。
  - source: social_id
    target: id_card_no
    type: string

  # 源列 card_status(char(1))。
  # ⚠️ **原样给源值,不做枚举归一化**。实测 ysx 分布:
  #    '0'=4101 / '3'=21 / '1'=4 / '2'=1 / '5'=1
  - source: card_status
    target: status
    type: string

  # 源列 vip_tax(numeric(16,4)):卡费(元)。
  # ⚠️ type 必须是 decimal(numeric 被 go-mssqldb 扫成 []byte,按 string 处理会出字节码)。
  - source: vip_tax
    target: fee_amount_yuan
    type: decimal
    unit: yuan

  # 源列 use_num(int):可用次数。
  # ⚠️ **哨兵值**:实测 ysx 有 1223 行 = 999999、405 行 = 999998
  #    (= 思迅的"不限次"编码)。原样给,不转 0、不转 NULL,由下游 importer 解释。
  - source: use_num
    target: limited_use_count
    type: int

  # 源列 acc_num(numeric):累计积分。✅ 实测 ysx 无 NULL(2864 行非零)。
  - source: acc_num
    target: points_accumulated
    type: decimal

  # 源列 dec_num(numeric):已用积分。✅ 实测 ysx 无 NULL(348 行非零)。
  - source: dec_num
    target: points_used
    type: decimal

  # 源列 memb_remaining_points:剩余积分 —— **派生列**(源库侧算:acc_num − dec_num)。
  # ⚠️ 本域(supertrade)member 表的剩余积分口径一致 ⇒ 两边可比。
  - source: memb_remaining_points
    target: remaining_points
    type: decimal

  # 源列 memb_balance:卡内余额(元)—— **派生列**,由源库侧 SQL 算出来
  # (Σ t_rm_saving_plus_record.plus_count − Σ t_rm_card_paylist.amount)。
  #
  # ⚠️ **不是** residual_amt:那一列是脏字符串('86220.0' / ':844201-' / '20,,' …,
  #    43 种取值,同一批卡上出现同一个残值),与真实余额(0~99.6 元)毫无关系。
  #    当余额导出去会让前端显示「余额 86220 元」(762 张卡)。
  #    口径与交叉验证见 internal/source/member_sql.go。
  - source: memb_balance
    target: balance_yuan
    type: decimal
    unit: yuan

  # 源列 residual_amt(**varchar(20)**):源库的**原值**,仅供审计。
  # ⚠️ 这一列是带脏值的字符串,不是数字 ⇒ type 必须是 string:
  #    若按 decimal 处理,fieldmapping.convert 会在 ParseFloat 上报错,
  #    而 dataloader.mapRows 对转换失败的行是**静默丢弃**的
  #    ⇒ 整张表的行数会悄悄少掉一大截(症状:COUNT(*) 对不上 4128,零报错)。
  - source: residual_amt
    target: residual_amt_raw
    type: string

  # 源列 memb_consume_amount:累计消费(元)—— 派生列,
  # 来自 t_rm_vip_consume.vip_cons_amount(主表 consum_amt 实测几乎全 0)。
  - source: memb_consume_amount
    target: consumed_amount_yuan
    type: decimal
    unit: yuan

  # 源列 memb_consume_count:消费次数 —— 派生列,
  # 来自 t_rm_vip_consume.cons_count(主表 consum_count 实测全 NULL)。
  - source: memb_consume_count
    target: consumed_count
    type: int

  # 源列 favor(varchar(50)):偏好。✅ 实测 ysx 全为空。
  - source: favor
    target: favorite
    type: string

  # 源列 memo(varchar(255)):备注。✅ 实测 ysx 只有 1 行非空。
  - source: memo
    target: remark
    type: string

  # 源列 branch_no(varchar(6)):门店号。
  # ⚠️ 实测 ysx 全是 '00'(4127 行)+ 1 行空 ⇒ **不可当分区键**用。
  - source: branch_no
    target: branch_no
    type: string

  # 源列 oper_id(char(4)):操作员。实测值如 '1000' / '5002'。
  - source: oper_id
    target: operator_id
    type: string

  # 源列 oper_date(datetime):建卡 / 最后一次业务操作时间。
  # 它同时是增量刷新的**回退列**(config.yaml 的 refresh.incremental_fallback.member):
  # 实测 modify_date 有 1154 行是 NULL,而 oper_date **0 行为 NULL**
  # ⇒ COALESCE(modify_date, oper_date) 能覆盖全部行。
  - source: oper_date
    target: operated_at
    type: datetime

  # 源列 vip_start_date(datetime):有效期起。实测 ysx 有 4 行为 NULL。
  - source: vip_start_date
    target: valid_from
    type: datetime

  # 源列 vip_end_date(datetime):有效期止。✅ 实测两库均无 NULL。
  - source: vip_end_date
    target: valid_until
    type: datetime

  # 源列 openid(varchar(60)):微信 OpenID。
  # ✅ 实测两库全为空,但列存在,将来接入微信会员后直接可用。
  - source: openid
    target: open_id
    type: string
