# ysx supplier mapping:思迅云商x t_bd_supcust_info → 统一 supplier
# 与 hbposv7 同 schema(同 source),因为思迅家族表结构一致
version: 1
model: supplier

mappings:
  - source: supcust_no
    target: id
    type: string

  - source: sup_name
    target: name
    type: string

  - source: sup_type
    target: type
    type: string

  - source: sup_man
    target: contact
    type: string

  - source: sup_tel
    target: phone
    type: string

  - source: sup_email
    target: email
    type: string

  - source: sup_addr
    target: address
    type: string

  - source: credit_amt
    target: credit_amount
    type: decimal
    unit: yuan

  - source: status
    target: status
    type: string

  - source: modify_date
    target: modified_at
    type: datetime