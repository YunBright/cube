# ysx supplier mapping:思迅云商x t_bd_supcust_info → 统一 supplier
# 与 hbposv7 同 schema(同 source),因为思迅家族表结构一致
version: 1
model: supplier

mappings:
  - source: supcust_no
    target: id
    type: string

  - source: sup_name
    target: name
    type: string

  - source: sup_type
    target: type
    type: string

  # 2026-10-16 新增:供应商/客户标识(AI 分析排除自用的第一道闸)。
  # ✅ 实测 S=165 / C=49。'C' 是客户(运营部、中铁五局搅拌站…),
  #   不是供货方,把它们排进供应商榜单会把团购混进零售统计。
  - source: supcust_flag
    target: cust_flag
    type: string

  # 2026-10-20 新增:供应商类别(指向 cust_type.id)。
  # ⚠️ 219 个里 170 个是 NULL —— 上层要能显示"未分类"。
  - source: cust_clsno
    target: cust_clsno
    type: string

  # 2026-10-16 新增:供货方式(展示用,不做自用判定主依据)。
  # ✅ 实测自用四条各不相同(B/C/E/D),说明该字段是各店自定义语义。
  - source: sale_way
    target: supply_way
    type: string

  - source: sup_man
    target: contact
    type: string

  - source: sup_tel
    target: phone
    type: string

  - source: sup_email
    target: email
    type: string

  - source: sup_addr
    target: address
    type: string

  - source: credit_amt
    target: credit_amount
    type: decimal
    unit: yuan

  # ⚠️ **ysx 的供应商表没有 status 列**(2026-10-23 真库实测 39 列:
  #    supcust_no / supcust_flag / sup_name / … / modify_date / cust_clsno,
  #    没有 status)。照着 hbposv7 写 `source: status` ⇒ live 查询直接报
  #    "列名 'status' 无效" ⇒ 整条供应商链路 502。
  #
  # ⇒ ysx 侧取 **display_flag**(是否显示):实测 217 行 '1' / 2 行 '0'。
  #
  # ⚠️ **极性与 hbposv7 相反**:hbposv7 的 status 是 '0' 正常(299 行)/ '1' 停用(1 行),
  #    而 display_flag 是 '1' 显示(217)/ '0' 隐藏(2)。
  #    ⇒ canonical `status` 在两个 family 里**不是同一个含义**,按 AGENTS.md §4
  #    "枚举值归一化不做" ⇒ 这里**原样给源值**,由 BI 层翻译;
  #    跨店比较 status 时**必须**知道自己看的是哪一家。
  - source: display_flag
    target: status
    type: string

  - source: modify_date
    target: modified_at
    type: datetime